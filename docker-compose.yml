services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sopotanten.rule=Host(`sopotan.minagiri.net`)"
      - "traefik.http.routers.sopotanten.entrypoints=websecure"
      - "traefik.http.routers.sopotanten.tls.certresolver=letsencrypt"
      - "traefik.http.services.sopotanten.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"

networks:
  traefik-network:
    name: traefik-network
    external: true